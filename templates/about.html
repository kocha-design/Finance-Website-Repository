{% extends 'base.html' %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ branding.about_title }}</h1>
        <p>{{ branding.about_subtitle }}</p>
    </div>
</section>

<section class="content-section">
    <div class="container">
        <div class="about-grid fade-in">
            <div>
                <h2><i class="fas fa-bullseye"></i> Our Mission</h2>
                <p>{{ branding.about_mission }}</p>
                <h2 style="margin-top: 2rem;"><i class="fas fa-eye"></i> Our Vision</h2>
                <p>{{ branding.about_vision }}</p>
            </div>
            <div class="stats-box">
                <div class="stat-item">
                    <h3>10+</h3>
                    <p>Years of Experience</p>
                </div>
                <div class="stat-item">
                    <h3>500M+</h3>
                    <p>Assets Managed</p>
                </div>
                <div class="stat-item">
                    <h3>50k+</h3>
                    <p>Happy Clients</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
