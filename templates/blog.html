{% extends 'base.html' %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>News & Insights</h1>
        <p>Expert advice and financial trends from our team.</p>
    </div>
</section>
<section class="content-section">
    <div class="container">
        <div class="blog-grid">
            {% for post in posts %}
            <div class="blog-card fade-in">
                {% if post.image %}<img src="{{ post.image.url }}" class="blog-img">{% endif %}
                <div class="blog-body">
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.excerpt|truncatechars:120 }}</p>
                    <a href="{% url 'blog_detail' post.slug %}" class="read-more">Read More <i class="fas fa-arrow-right"></i></a>
                </div>
            </div>
            {% empty %}
            <p>No articles yet.</p>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
