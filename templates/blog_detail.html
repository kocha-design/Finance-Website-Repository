{% extends 'base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ post.title }}</h1>
        <p>{{ post.created_at|date:"F d, Y" }}</p>
    </div>
</section>
<section class="content-section">
    <div class="container article-container">
        {% if post.image %}<img src="{{ post.image.url }}" class="article-hero-img">{% endif %}
        <div class="article-content">
            {{ post.content|linebreaks }}
        </div>
        <a href="/blog/" class="btn" style="margin-top:2rem;">← Back to Insights</a>
    </div>
</section>
{% endblock %}
